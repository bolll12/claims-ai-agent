services:
  app:
    image: ${APP_IMAGE:-claims-agent:dev}
    build: .
    ports: ["127.0.0.1:8001:8001"]
    env_file: .env
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-local}
      APP_ENV: ${APP_ENV:-development}
      LOCAL_LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-http://host.docker.internal:8000/v1}
      MILVUS_URI: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      CLAIMS_CHECKPOINT_DB: /app/.data/checkpoints.sqlite
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["claims_data:/app/.data"]
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    profiles: [infra]
    ports: ["127.0.0.1:6379:6379"]
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: [infra]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes: ["etcd_data:/etcd"]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: [infra]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: [minio, server, /minio_data]
    volumes: ["minio_data:/minio_data"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 5
  milvus:
    image: milvusdb/milvus:v2.4.0
    profiles: [infra]
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    volumes: ["milvus_data:/var/lib/milvus"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  claims_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
