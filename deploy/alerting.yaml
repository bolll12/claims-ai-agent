groups:
  - name: claims
    rules:
      - alert: ClaimsP99LatencyHigh
        expr: histogram_quantile(0.99, sum(rate(claims_latency_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels: {severity: P1}
        annotations: {summary: 理赔P99延迟超过10秒}
      - alert: ClaimsErrorRateHigh
        expr: sum(rate(claims_errors_total[5m])) / clamp_min(sum(rate(claims_requests_total[5m])) + sum(rate(claims_errors_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: P1}
        annotations: {summary: 理赔处理错误率超过5%}
      - alert: ClaimsConfidenceDrift
        expr: (sum(increase(claims_confidence_sum[1d])) / clamp_min(sum(increase(claims_confidence_count[1d])), 1)) < 0.8 * (sum(increase(claims_confidence_sum[1d] offset 1d)) / clamp_min(sum(increase(claims_confidence_count[1d] offset 1d)), 1))
        for: 30m
        labels: {severity: P2}
        annotations: {summary: 平均置信度日降幅超过20%}
      - alert: ClaimsIterationsHigh
        expr: sum(rate(claims_iterations_sum[5m])) / clamp_min(sum(rate(claims_iterations_count[5m])), 0.001) > 6
        for: 10m
        labels: {severity: P2}
        annotations: {summary: 平均处理轮次超过6}
      - alert: ClaimsTokenGrowth
        expr: sum(increase(claims_tokens_total[1d])) > 1.5 * sum(increase(claims_tokens_total[1d] offset 1d)) and sum(increase(claims_tokens_total[1d] offset 1d)) > 0
        for: 30m
        labels: {severity: P2}
        annotations: {summary: Token用量较前日增加50%}
      - alert: ClaimsAcceptRateOutsideReference
        expr: (sum(rate(claims_requests_total{decision="accept"}[1h])) / clamp_min(sum(rate(claims_requests_total[1h])), 0.001) < 0.6) or (sum(rate(claims_requests_total{decision="accept"}[1h])) / clamp_min(sum(rate(claims_requests_total[1h])), 0.001) > 0.9)
        for: 30m
        labels: {severity: P2}
        annotations: {summary: 受理建议比例超出教学参考区间，需结合流量和案件类型核实}
