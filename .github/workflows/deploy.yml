name: claims-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pip check
      - run: ruff check .
      - run: mypy settings.py models/schemas.py
      - run: bandit -q -r agents adapters tools prompts models app.py config.py settings.py claims_agent.py monitoring.py
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ['3.10', '3.12']}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pytest --cov=agents --cov=adapters --cov=models --cov=tools --cov=prompts --cov-report=term-missing --cov-fail-under=80
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: cp .env.example .env
      - run: docker compose --profile infra up -d --wait --wait-timeout 240 etcd minio milvus redis
      - run: RUN_MILVUS_TESTS=1 pytest -q tests/test_milvus_integration.py
      - if: always()
        run: docker compose --profile infra logs --tail=100
      - if: always()
        run: docker compose --profile infra down
  deep-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: isolated_deep/requirements.txt}
      - run: pip install -r isolated_deep/requirements.txt
      - run: pip check
      - run: pytest -q isolated_deep/tests
  image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, tests, infrastructure, deep-agents]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with: {context: '.', push: true, tags: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'}
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency: {group: claims-production, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy reviewed revision via SSH
        env:
          DEPLOY_HOST: '${{ secrets.DEPLOY_HOST }}'
          DEPLOY_USER: '${{ secrets.DEPLOY_USER }}'
          DEPLOY_KEY: '${{ secrets.DEPLOY_KEY }}'
          DEPLOY_KNOWN_HOSTS: '${{ secrets.DEPLOY_KNOWN_HOSTS }}'
          DEPLOY_DIR: '${{ vars.DEPLOY_DIR }}'
          APP_IMAGE: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
          REVISION: '${{ github.sha }}'
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}" "${DEPLOY_DIR:?}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          [[ "$APP_IMAGE" =~ ^[a-zA-Z0-9./:_-]+$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/claims_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/claims_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/claims_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR' && test \"\$(git rev-parse HEAD)\" = '$REVISION' && APP_IMAGE='$APP_IMAGE' ./deploy.sh prod"
