[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv*", ".data"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
[tool.bandit]
exclude_dirs = ["tests", "isolated_deep/tests", ".venv", ".venv-deep", ".venv-python310-unusable"]
